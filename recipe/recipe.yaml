# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 2026.09.01
  # utilities
  share: ${{ "$PREFIX" if unix else "%PREFIX%" }}/share/hunspell_dictionaries
  mkdirp: ${{ "mkdir -p" if unix else "md" }}
  cp: ${{ "cp" if unix else "copy" }}
  cp_all: ${{ mkdirp }} "${{ share }}" && ${{ cp }} *.aff *.dic "${{ share }}"

recipe:
  name: aoo-mozilla-en-dict
  version: ${{ version }}

source:
  url: https://github.com/marcoagpinto/aoo-mozilla-en-dict/archive/${{ version }}.tar.gz
  sha256: 68349bfc36a17bddb16f8fde63fa10f5cf82f1e6c7b21393d3389e303cf2d97d

build:
  number: 0
  noarch: generic

outputs:
  # metapackage
  - package:
      name: hunspell-en
    build:
      noarch: generic
    requirements:
      run:
        - hunspell
        - ${{ pin_subpackage("aoo-mozilla-en-dict-au", exact=True) }}
        - ${{ pin_subpackage("aoo-mozilla-en-dict-ca", exact=True) }}
        - ${{ pin_subpackage("aoo-mozilla-en-dict-gb", exact=True) }}
        - ${{ pin_subpackage("aoo-mozilla-en-dict-gb-oxendict", exact=True) }}
        - ${{ pin_subpackage("aoo-mozilla-en-dict-us", exact=True) }}
        - ${{ pin_subpackage("aoo-mozilla-en-dict-za", exact=True) }}
    tests:
      - requirements: { run: [hunspell, pytest] }
        script:
          env:
            CF_EN_LOCALES: AU CA GB GB-oxendict US ZA
          file: test_hunspell.py

  # locales
  - package:
      name: aoo-mozilla-en-dict-au
    build:
      noarch: generic
      script: cd "en_AU (-ise) (alt)" && ${{ cp_all }}
    tests:
      - requirements: { run: [hunspell, pytest] }
        script: { file: test_hunspell.py }

  - package:
      name: aoo-mozilla-en-dict-ca
    build:
      noarch: generic
      script: cd "en_CA (mixed) (alt)" && ${{ cp_all }}
    tests:
      - requirements: { run: [hunspell, pytest] }
        script: { file: test_hunspell.py }

  - package:
      name: aoo-mozilla-en-dict-gb
    build:
      noarch: generic
      script: cd "en_GB (-ise)" && ${{ cp_all }}
    tests:
      - requirements: { run: [hunspell, pytest] }
        script: { file: test_hunspell.py }

  - package:
      name: aoo-mozilla-en-dict-gb-oxendict
    build:
      noarch: generic
      script: cd "en_GB (-ize) (Oxford)" && ${{ cp_all }}
    tests:
      - requirements: { run: [hunspell, pytest] }
        script: { file: test_hunspell.py }

  - package:
      name: aoo-mozilla-en-dict-us
    build:
      noarch: generic
      script: cd "en_US (-ize) (alt)" && ${{ cp_all }}
    tests:
      - requirements: { run: [hunspell, pytest] }
        script: { file: test_hunspell.py }

  - package:
      name: aoo-mozilla-en-dict-za
    build:
      noarch: generic
      script: cd "en_ZA (-ise)" && ${{ cp_all }}
    tests:
      - requirements: { run: [hunspell, pytest] }
        script: { file: test_hunspell.py }

about:
  homepage: https://github.com/marcoagpinto/aoo-mozilla-en-dict
  summary: "English Dictionaries Project (AOO+Mozilla+others)"
  license: LGPL-3.0-or-later
  license_file: LICENSE

extra:
  feedstock-name: hunspell-en
  recipe-maintainers:
    - scopatz
    - bollwyvl
